<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon 75192 – Bag Checklist</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1a;--mute:#6b6a65;--line:#e2e0d9;--ok:#1f8a4c;--warn:#c27a00;--bad:#c0392b;--accent:#2b5fd9}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#efede8;--mute:#9a988f;--line:#34332f;--ok:#4cc27f;--warn:#f0a32b;--bad:#ef6b5c;--accent:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px}
h1{font-size:17px;margin:0 0 6px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer}
button:active{transform:scale(.97)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bk{font-size:12.5px;color:var(--mute);margin-top:6px}
.bk.warn{color:var(--warn);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{outline:2px solid var(--accent)}
.chip i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
main{padding:12px 14px 80px;max-width:980px;margin:0 auto}
section h2{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}

section h2 small{color:var(--mute);font-weight:400}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px}
.row.done{border-left-color:var(--ok)}
.row.short{border-left-color:var(--warn)}
.row.broken{border-left-color:var(--bad)}
.pic{width:64px;height:64px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);font-size:10px;color:#555;text-align:center;line-height:1.1;padding:2px}
.pic img{width:100%;height:100%;object-fit:contain}
.meta .pn{font-weight:600}
.meta .pn a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
.meta .d{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--mute);margin-left:6px}
.tag.warn{background:#f6e3b6;color:#6a4500}
.ctl{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:36px;height:36px;font-size:20px;padding:0;line-height:1}
.cnt .n{min-width:64px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.cnt .n small{color:var(--mute);font-size:12px}
.sub{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute)}
.sub button{padding:3px 8px;font-size:12.5px}
.status{font-size:12.5px;font-weight:600}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
.hidden{display:none!important}.bagsline{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}.bg{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--ink)}.bg.ok{color:var(--ok);font-weight:600}.cd{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.35);margin-right:5px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:min(720px,94vw);width:100%}
dialog textarea{width:100%;height:50vh;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
@media(max-width:560px){.row{grid-template-columns:52px 1fr}.pic{width:52px;height:52px}.ctl{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
</style>
</head>

  <div class="bk" id="bk"></div>

  <div class="chips" id="cchips"></div>
</header>
<main id="main"></main>

  const r=el("div","row");r.dataset.ix=ix.join(",");
  const pic=el("div","pic");
  const im=new Image();im.loading="lazy";im.alt=p.part;im.src=imgFor(p);im.onerror=()=>{pic.textContent=p.part};pic.appendChild(im);
  r.appendChild(pic);
  const m=el("div","meta");
  m.innerHTML=`<div class="pn"><a href="https://www.bricklink.com/v2/catalog/catalogitem.page?P=${encodeURIComponent(p.part)}" target="_blank" rel="noopener">${esc(p.part)}</a></div><div class="d"><i class="cd" style="background:${COLORS[p.color]||"#999"}"></i>${esc(p.color)} · ${esc(p.desc)}</div>`;
  const bl=el("div","bagsline");m.appendChild(bl);
  r.appendChild(m);
  const ctl=el("div","ctl"),cnt=el("div","cnt");
  const minus=el("button","",'−'),plus=el("button","",'+'),n=el("div","n"),all=el("button","","All");
  all.title="Set counted = expected";all.style.cssText="width:auto;font-size:13px;padding:0 9px";
  cnt.append(minus,n,plus,all);
  const sub=el("div","sub"),bm=el("button","","−"),bp=el("button","","+"),bn=el("span","","0");
  sub.append("broken",bm,bn,bp);
  const status=el("div","status");
  ctl.append(cnt,sub,status);r.appendChild(ctl);
  function paint(){
    let F=0,B=0;ix.forEach(i=>{F+=g(i).f;B+=g(i).b});
    const miss=QTY-F;
    n.innerHTML=`${F}<small> / ${QTY}</small>`;bn.textContent=B;
    r.classList.toggle("done",miss<=0&&B===0&&F>0);
    r.classList.toggle("broken",B>0);
    r.classList.toggle("short",miss>0&&F>0);
    let t="",k="";
    if(B>0){t=`${B} of ${F} broken`+(miss>0?` · ${miss} to find`:"");k="bad"}
    else if(miss>0&&F>0){t=`${miss} to find`;k="warn"}
    else if(miss<=0&&F>0){t=F>QTY?`✓ +${F-QTY} extra`:"✓ complete";k="ok"}
    status.textContent=t;status.className="status "+k;
    r.dataset.done=(miss<=0&&B===0&&F>0)?1:0;
    r.dataset.prob=(B>0||(miss>0&&F>0))?1:0;
    if(multi){bl.innerHTML=ix.map(i=>{const s=g(i),q=PARTS[i].qty,ok=s.f>=q;
      return `<span class="bg${ok?" ok":""}">${PARTS[i].bag===0?"Loose":"Bag "+PARTS[i].bag} · ${s.f}/${q}${s.b?" ("+s.b+" broken)":""}${ok?" ✓":""}</span>`}).join("")}
  }
  const room=i=>g(i).f<PARTS[i].qty;
  const set=(i,f,b)=>{st[i]={f:Math.max(0,f),b:Math.max(0,b)}};
  const after=()=>{commit();paint();updateStats();applyFilters()};
  plus.onclick=()=>{const i=ix.find(room)??ix[ix.length-1];set(i,g(i).f+1,g(i).b);after()};
  minus.onclick=()=>{const i=[...ix].reverse().find(j=>g(j).f>0);if(i===undefined)return;const f=g(i).f-1;set(i,f,Math.min(g(i).b,f));after()};
  all.onclick=()=>{ix.forEach(i=>set(i,Math.max(g(i).f,PARTS[i].qty),g(i).b));after()};
  bp.onclick=()=>{let i=ix.find(j=>g(j).b<g(j).f);if(i!==undefined){set(i,g(i).f,g(i).b+1)}else{i=ix.find(room)??ix[ix.length-1];set(i,g(i).f+1,g(i).b+1)}after()};
  bm.onclick=()=>{const i=[...ix].reverse().find(j=>g(j).b>0);if(i===undefined)return;set(i,g(i).f,g(i).b-1);after()};
  paint();return r;
}
function applyFilters(){
  const q=query.toLowerCase();
  document.querySelectorAll("section").forEach(sec=>{
    let any=false;
    sec.querySelectorAll(".row").forEach(r=>{
      const p=PARTS[+r.dataset.ix.split(",")[0]];
      let show=true;
      if(colorFilter&&p.color!==colorFilter)show=false;
      if(q&&!(p.part.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.color.toLowerCase().includes(q)))show=false;
      if(hideDone&&r.dataset.done==="1")show=false;
      if(onlyProblem&&r.dataset.prob!=="1")show=false;
      r.classList.toggle("hidden",!show);if(show)any=true;
    });
    sec.classList.toggle("hidden",!any);
  });
}
function updateStats(){
  let tot=0,f=0,b=0,types=0;
  PARTS.forEach((p,i)=>{const s=g(i);tot+=p.qty;f+=Math.min(s.f,p.qty);b+=s.b;if(s.f>=p.qty&&s.f>0)types++});
  const miss=Math.max(0,tot-f);
  sFound.textContent=f;sTotal.textContent=tot;sBroken.textContent=b;sMissing.textContent=miss;sTypes.textContent=types;sTypesTotal.textContent=PARTS.length;
  const bs={};PARTS.forEach((p,i)=>{const s=g(i);const o=bs[p.bag]=bs[p.bag]||[0,0,0];o[0]+=Math.min(s.f,p.qty);o[1]+=p.qty;o[2]=(o[2]||0)+s.f+s.b});
  Object.keys(bs).forEach(k=>{const e=document.getElementById("bp"+k);if(e)e.textContent=bs[k][0]+" / "+bs[k][1]+(bs[k][0]===bs[k][1]?" ✓":"")});
  bar.style.width=(100*f/tot)+"%";
  Object.keys(bs).forEach(k=>{const c=bagChips[k];if(!c)return;const done=bs[k][0]===bs[k][1],any=bs[k][2]>0;
    c.textContent=(k==="0"?"Loose":"Bag "+k)+(done?" ✓":any?" ◐":"");c.title=done?"Complete":any?"Partly counted":"Nothing logged yet"});
}
const bagChips={};
function buildColorChips(){
  const cw=document.getElementById("cchips");cw.innerHTML="";
  const cols=[...new Set(PARTS.filter(p=>bagFilter===null||String(p.bag)===bagFilter).map(p=>p.color))];
  if(colorFilter&&!cols.includes(colorFilter))colorFilter=null;
  const pick=x=>{cw.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));x.classList.add("on")};
  const allC=el("span","chip"+(colorFilter?"":" on"),"All colours");allC.onclick=()=>{colorFilter=null;pick(allC);applyFilters()};cw.appendChild(allC);
  cols.forEach(c=>{const ch=el("span","chip"+(colorFilter===c?" on":""),`<i style="background:${COLORS[c]||"#999"}"></i>${esc(c)}`);ch.onclick=()=>{colorFilter=c;pick(ch);applyFilters()};cw.appendChild(ch)});
}
function buildChips(){
  const bw=document.getElementById("chips");
  const pick=x=>{bw.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));x.classList.add("on")};
  const allB=el("span","chip on","All bags (combined)");allB.onclick=()=>{bagFilter=null;pick(allB);render();window.scrollTo({top:0})};bw.appendChild(allB);
  [...new Set(PARTS.map(p=>String(p.bag)))].forEach(c=>{const ch=el("span","chip",c==="0"?"Loose":"Bag "+c);bagChips[c]=ch;ch.onclick=()=>{bagFilter=c;pick(ch);render();window.scrollTo({top:0})};bw.appendChild(ch)});
}
function csv(rows){return rows.map(r=>r.map(v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v).join(",")).join("\n")}
function showDlg(title,text){dlgT.textContent=title;dlgTa.value=text;dlg.showModal()}
document.getElementById("q").oninput=e=>{query=e.target.value;applyFilters()};
fOpen.onclick=()=>{hideDone=!hideDone;fOpen.classList.toggle("on",hideDone);applyFilters()};
fProblem.onclick=()=>{onlyProblem=!onlyProblem;fProblem.classList.toggle("on",onlyProblem);applyFilters()};
exp.onclick=()=>{
  const rows=[["bag","part","colour","description","expected","counted","broken","missing"]];
  PARTS.forEach((p,i)=>{const s=g(i),m=p.qty-s.f;if(m>0||s.b>0)rows.push([p.bag,p.part,p.color,p.desc,p.qty,s.f,s.b,Math.max(0,m)])});
  showDlg("Missing / broken parts ("+(rows.length-1)+" lines) – only meaningful once you've counted everything",csv(rows));
};
exp2.onclick=()=>{
  const rows=[["bag","part","colour","description","expected","counted","broken","missing/extra"]];
  PARTS.forEach((p,i)=>{const s=g(i);rows.push([p.bag,p.part,p.color,p.desc,p.qty,s.f,s.b,p.qty-s.f])});
  showDlg("All parts",csv(rows));
};
reset.onclick=()=>{if(confirm("Clear every count and start over?\n\n(Tip: use Save progress first if you might want them back.)")){st={};persist();meta.changes=0;saveMeta();paintBk();render()}};
save.onclick=()=>{
  const counts={};let n=0;
  PARTS.forEach((p,i)=>{const s=g(i);if(s.f||s.b){counts[keyOf(i)]={f:s.f,b:s.b};n++}});
  const d=new Date(),pad=x=>String(x).padStart(2,"0");
  const payload={app:"falcon75192-bags",version:3,saved:d.toISOString(),partTypes:PARTS.length,counts};
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`falcon-75192-progress-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  meta.last=d.toISOString();meta.changes=0;saveMeta();paintBk();
};
load.onclick=()=>file.click();
file.onchange=()=>{
  const f=file.files[0];file.value="";if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let data;try{data=JSON.parse(rd.result)}catch(e){alert("That file isn't a valid progress file.");return}
    if(!data||data.app!=="falcon75192-bags"||!data.counts){alert("That doesn't look like a progress file saved from this checklist.");return}
    const keys={};PARTS.forEach((p,i)=>keys[keyOf(i)]=i);
    const incoming=Object.keys(data.counts),known=incoming.filter(k=>k in keys);
    const when=data.saved?new Date(data.saved).toLocaleString():"unknown date";
    if(!confirm(`Replace your current counts with this saved file?\n\nSaved: ${when}\nParts with counts: ${known.length}`+(incoming.length>known.length?`\n(${incoming.length-known.length} entries didn't match this list and will be skipped)`:""))) return;
    const ns={};known.forEach(k=>{const v=data.counts[k];const bb=Math.max(0,+v.b||0),ff=Math.max(0,+v.f||0);ns[keys[k]]={f:(data.version||1)<3?ff+bb:ff,b:bb}});
    st=ns;persist();meta.changes=0;meta.last=data.saved||meta.last;saveMeta();paintBk();render();
  };
  rd.readAsText(f);
};
dlgClose.onclick=()=>dlg.close();
dlgCopy.onclick=()=>{dlgTa.select();navigator.clipboard?navigator.clipboard.writeText(dlgTa.value):document.execCommand("copy")};
buildChips();render();paintBk();
</script>
</body>
