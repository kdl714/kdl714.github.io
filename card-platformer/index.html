<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPhone: "Add to Home Screen" launches full-screen like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deckhop">
<meta name="theme-color" content="#1d2333">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Deckhop</title>
<!-- ?v=… makes phones fetch fresh files after an update: change it whenever you upload new versions -->
<link rel="stylesheet" href="style.css?v=2026-10-15b">
</head>
<body>
<!-- Start, Puzzles, level set and Settings screens (built by game.js) -->
<main id="menu"></main>
<header>
  <button id="backBtn" aria-label="Back">‹</button>
  <h1 id="gameTitle">Deckhop</h1>
  <select id="levelSel" aria-label="Level"></select>
  <span class="seg" id="modeSeg" title="How turns work (CONFIG.turnMode)">
    <button data-mode="plan"><span class="lg">Plan &amp; Run</span><span class="sm">Plan</span></button>
    <button data-mode="instant">Instant</button>
    <button data-mode="time">Endless</button>
    <button data-mode="run"><span class="lg">Roguelite</span><span class="sm">Rogue</span></button>
    <button data-mode="quest"><span class="lg">Roguelite</span><span class="sm">Rogue</span></button>
  </span>
  <span class="spacer"></span>
  <button id="editBtn" aria-label="Editor">✎<span class="lg"> Editor</span></button>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="rotateHint">Turn your phone sideways for a bigger view</div>
  <div id="banner"><h2></h2><p></p><div class="row"></div></div>
</div>

<section id="deck">
  <div id="hintBox"></div>
  <div id="perkBar"></div>
  <div id="timer"><i id="timerFill"></i></div>
  <div id="play">
    <div class="lanes">
      <div class="lane">
        <div class="lane-label" id="seqLabel">Sequence</div>
        <div class="cards" id="seq"></div>
      </div>
      <div class="lane" id="handLane">
        <div class="lane-label" id="handLabel">Hand</div>
        <div class="cards" id="hand"></div>
      </div>
      <div class="lane" id="shopLane">
        <div class="lane-label" id="shopLabel">Shop</div>
        <div class="cards" id="shop"></div>
      </div>
    </div>
    <div class="actions" id="seqActions"></div>
  </div>

  <div id="editor">
    <div class="group">
      <b>Level name</b>
      <input id="edName">
      <b>Size</b>
      <select id="edSize" aria-label="Level size"></select>
      <b>Location</b>
      <select id="edTheme" aria-label="Location">
        <option value="meadow">Meadow</option>
        <option value="canyon">Dusk Canyon</option>
        <option value="peaks">Snowy Peaks</option>
      </select>
      <b>Paint tile</b>
      <div class="tiles" id="edTiles"></div>
    </div>
    <div class="group">
      <b>Hand (cards given)</b>
      <div class="cardcounts" id="edCards"></div>
    </div>
    <div class="group">
      <b>Level</b>
      <div class="actions">
        <button class="primary" id="edPlay">▶ Playtest</button>
        <button id="edSolve">Check solvable</button>
        <button id="edSave">Save</button>
      </div>
      <div class="actions">
        <button id="edNew">New blank</button>
        <button id="edIO">Import / Export</button>
        <button id="edDelete">Delete</button>
      </div>
      <div id="solveOut"></div>
    </div>
  </div>
</section>

<div id="dropMarker"></div>
<dialog id="ioDlg">
  <p style="margin-top:0">Level JSON — copy it out to share, or paste one in and press Import.</p>
  <textarea id="ioText" spellcheck="false"></textarea>
  <div class="actions" style="margin-top:8px;justify-content:flex-end">
    <button id="ioCopy">Copy</button>
    <button id="ioImport" class="primary">Import</button>
    <button id="ioClose">Close</button>
  </div>
</dialog>

<script src="config.js?v=2026-10-15b"></script>
<script src="rules.js?v=2026-10-15b"></script>
<script src="levels.js?v=2026-10-15b"></script>
<script src="art.js?v=2026-10-15b"></script>
<script src="pixel.js?v=2026-10-15b"></script>
<script src="game.js?v=2026-10-15b"></script>
</body>
</html>
