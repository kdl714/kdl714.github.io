<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPhone: "Add to Home Screen" launches full-screen like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Climber">
<meta name="theme-color" content="#1d2333">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Card Climber</title>
<style>
  :root {
    --bg: #1d2333; --panel: #262d40; --panel2: #2f3750; --text: #eef1f8; --muted: #9aa3bb;
    --accent: #ffcc33; --good: #5cd18b; --bad: #ff6b6b; --line: #3c4562;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; overscroll-behavior: none;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button, .card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  @media (hover: hover) { button:hover:not(:disabled) { border-color: var(--accent); } }
  button:active:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #1d2333; border-color: var(--accent); font-weight: 600; }
  select, input, textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

  header { display: flex; gap: 10px; align-items: center;
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; color: var(--accent); }
  header .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: #1d2333; font-weight: 600; }

  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 16px; }
  #cv { display: block; border-radius: 8px; box-shadow: 0 4px 20px #0006; touch-action: none; }
  #banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #1d2333ee; border: 2px solid var(--accent);
    border-radius: 10px; padding: 16px 24px; text-align: center; display: none; min-width: 240px; }
  #banner h2 { margin: 0 0 6px; font-size: 20px; }
  #banner p { margin: 0 0 12px; color: var(--muted); white-space: pre-line; }
  #banner .row { display: flex; gap: 8px; justify-content: center; }
  #rotateHint { display: none; color: var(--muted); font-size: 11px; text-align: center; }
  #hud { position: absolute; left: 24px; top: 14px; font-size: 12px; background: #0007; padding: 3px 8px; border-radius: 4px; pointer-events: none; }

  #deck { flex: 0 0 auto; max-height: 45vh; background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  #play { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; }
  #play .lanes { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #seqActions { flex-direction: column; justify-content: center; }
  #seqActions button { width: 100%; }
  .lane { display: flex; align-items: center; gap: 10px; }
  .lane-label { width: 72px; flex-shrink: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .cards { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-height: 94px; align-items: center; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .card { width: 80px; height: 92px; background: #f6f1e4; color: #2a2a2a; border-radius: 8px; border: 2px solid #d8cfb8; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; padding: 5px 3px; cursor: pointer; user-select: none; position: relative; transition: transform .1s; }
  @media (hover: hover) { .card:hover { transform: translateY(-3px); border-color: var(--accent); } }
  .card:active { transform: translateY(-3px); border-color: var(--accent); }
  .card .nm { font-weight: 700; font-size: 12px; white-space: nowrap; }
  .card .pic { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .card .pic svg { max-width: 100%; max-height: 100%; }
  .chip { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; background: #f6f1e4; border-radius: 4px;
    padding: 2px 4px; margin: 0 1px; height: 24px; }
  .chip svg { height: 18px; width: auto; }
  .card svg { display: block; }
  .card .idx { position: absolute; top: -8px; left: -8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 50%;
    width: 20px; height: 20px; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent); }
  .card.hinted { border-color: #4fd8e8; box-shadow: 0 0 0 3px #4fd8e8; }
  .card .key { position: absolute; top: 2px; right: 4px; font-size: 9px; color: #9a917c; }
  #hintBox { display: none; background: #4fd8e81a; border: 1px solid #4fd8e866; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  #timer { display: none; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  #timer i { display: block; height: 100%; width: 0; background: var(--accent); }
  .card.cycling { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
  .peek { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .peek b { font-weight: 600; font-size: 10px; background: #f6f1e4; color: #2a2a2a; border-radius: 4px; padding: 1px 5px; text-transform: none; letter-spacing: 0; }
  #banner .reward { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 10px; }
  #banner .reward .label { font-size: 12px; color: var(--muted); }
  #banner .reward .extra { margin-bottom: 0; flex-wrap: wrap; }
  canvas.mini { border-radius: 4px; max-width: 100%; }
  .offer { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 96px; }
  .offer small { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; }
  #banner { max-height: calc(100% - 8px); overflow: auto; }
  #banner.wide { position: fixed; z-index: 10; width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 10px 40px #000a; }
  #shopLane { display: none; }
  .card .price { position: absolute; top: -8px; right: -8px; background: #4fd8e8; color: #10333a; font-weight: 700; font-size: 11px; border-radius: 10px; padding: 1px 6px; }
  .card .sell { position: absolute; bottom: -8px; right: -6px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); font-size: 10px; border-radius: 10px; padding: 1px 6px; cursor: pointer; }
  .card.cant { opacity: .4; cursor: not-allowed; }
  .drag-ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 12px 28px #000a; border-color: var(--accent); transition: none; }
  .drag-ghost.out { border-color: var(--bad); opacity: .85; }
  .drag-ghost.out::after { content: attr(data-out); position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap;
    background: var(--bad); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
  .card.dragging { opacity: .3; }
  #dropMarker { display: none; position: fixed; z-index: 51; width: 4px; border-radius: 2px; background: var(--accent); pointer-events: none; box-shadow: 0 0 8px var(--accent); }
  #seq.drop-target { outline: 2px dashed #ffcc3388; outline-offset: 4px; border-radius: 8px; }
  #perkBar { display: none; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  #perkBar span { background: #5b3fd133; border: 1px solid #5b3fd1aa; color: var(--text); border-radius: 12px; padding: 2px 8px; }
  #banner .routes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .route { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 150px; padding: 10px 8px; text-align: center; }
  .route b { font-size: 15px; }
  .route small { color: var(--muted); font-size: 11px; line-height: 1.25; }
  .route .icon { font-size: 30px; height: 63px; display: flex; align-items: center; color: var(--accent); }
  .route.risky b { color: var(--bad); } .route.safe b { color: var(--good); } .route.perk b { color: #b8a6ff; }
  .route.perk { width: 160px; min-height: 90px; justify-content: center; }
  .played-count { color: var(--muted); font-size: 12px; align-self: center; }
  .card.done { opacity: .5; }
  .lane-label small { display: block; text-transform: none; letter-spacing: 0; margin-top: 4px; }
  #banner .extra { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .card.failed { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad); }
  .slot { width: 80px; height: 92px; border: 2px dashed var(--line); border-radius: 8px; }
  .locked .card { cursor: default; }
  .locked .card:hover, .locked .card:active { transform: none; }

  /* Editor */
  #editor { display: none; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #editor .group { display: flex; flex-direction: column; gap: 6px; }
  #editor .group > b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tiles { display: flex; gap: 4px; flex-wrap: wrap; max-width: 300px; }
  .tiles button { display: flex; align-items: center; gap: 6px; padding: 4px 8px; }
  .tiles button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tiles i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .cardcounts { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 6px; align-items: center; font-size: 12px; }
  .cardcounts button { padding: 0 7px; }
  .cardcounts span.n { min-width: 14px; text-align: center; }
  #solveOut { font-size: 12px; color: var(--muted); max-width: 320px; white-space: pre-wrap; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(640px, 92vw); }
  dialog textarea { width: 100%; height: 280px; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  dialog::backdrop { background: #0008; }

  /* Phones, portrait: stack everything; game on top, cards below */
  @media (max-width: 600px) {
    header { gap: 6px; }
    header h1 { display: none; }
    select, input, textarea { font-size: 16px; }   /* stops iOS zooming in on focus */
    #stage { flex: 0 0 auto; padding: 8px; flex-direction: column; gap: 6px; }
    #deck { flex: 1 1 auto; max-height: none; }
    #hud { left: 14px; top: 12px; font-size: 10px; }
    .lane-label { width: auto; }
    .lane { flex-direction: column; align-items: stretch; gap: 4px; }
    .cards { min-height: 84px; gap: 6px; }
    .card, .slot { width: 62px; height: 80px; }
    .card .nm { font-size: 10.5px; }
    #play { grid-template-columns: 1fr; }
    #seqActions { flex-direction: row; }
    #seqActions button { width: auto; flex: 1; padding: 10px 8px; }
    #banner { width: calc(100% - 24px); min-width: 0; padding: 12px; }
    #banner .extra .card { width: 70px; }
  }
  @media (max-width: 600px) and (pointer: coarse) { #rotateHint { display: block; } }
  /* Phones, landscape: game on the left, cards in a scrolling column on the right */
  @media (orientation: landscape) and (max-height: 500px) {
    body { display: grid; grid-template-columns: 1fr minmax(240px, 36%); grid-template-rows: auto minmax(0, 1fr); }
    header { grid-column: 1 / -1; padding-top: 6px; padding-bottom: 6px; }
    header h1 { display: none; }
    select, input, textarea { font-size: 16px; }
    #stage { padding: 6px 8px 6px max(8px, env(safe-area-inset-left)); }
    #deck { max-height: none; border-top: 0; border-left: 1px solid var(--line); padding-top: 8px; }
    #play { grid-template-columns: 1fr; }
    .lane { flex-direction: column; align-items: stretch; gap: 4px; }
    .lane-label { width: auto; }
    .cards { min-height: 0; gap: 6px; }
    .card, .slot { width: 58px; height: 74px; }
    .card .nm { font-size: 10.5px; }
    #seqActions { flex-direction: row; order: -1; }
    #seqActions button { width: auto; flex: 1; padding: 8px 6px; }
    #editor { flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <h1>Card Climber</h1>
  <select id="levelSel" aria-label="Level"></select>
  <span class="seg" id="modeSeg" title="How turns work (CONFIG.turnMode)">
    <button data-mode="plan">Plan &amp; Run</button>
    <button data-mode="instant">Instant</button>
    <button data-mode="time">Time Attack</button>
    <button data-mode="run">Roguelite</button>
    <button data-mode="quest">Roguelite</button>
  </span>
  <span class="spacer"></span>
  <button id="editBtn">✎ Editor</button>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="rotateHint">Turn your phone sideways for a bigger view</div>
  <div id="banner"><h2></h2><p></p><div class="row"></div></div>
</div>

<section id="deck">
  <div id="hintBox"></div>
  <div id="perkBar"></div>
  <div id="timer"><i id="timerFill"></i></div>
  <div id="play">
    <div class="lanes">
      <div class="lane">
        <div class="lane-label" id="seqLabel">Sequence</div>
        <div class="cards" id="seq"></div>
      </div>
      <div class="lane" id="handLane">
        <div class="lane-label" id="handLabel">Hand</div>
        <div class="cards" id="hand"></div>
      </div>
      <div class="lane" id="shopLane">
        <div class="lane-label" id="shopLabel">Shop</div>
        <div class="cards" id="shop"></div>
      </div>
    </div>
    <div class="actions" id="seqActions"></div>
  </div>

  <div id="editor">
    <div class="group">
      <b>Level name</b>
      <input id="edName">
      <b>Paint tile</b>
      <div class="tiles" id="edTiles"></div>
    </div>
    <div class="group">
      <b>Hand (cards given)</b>
      <div class="cardcounts" id="edCards"></div>
    </div>
    <div class="group">
      <b>Level</b>
      <div class="actions">
        <button class="primary" id="edPlay">▶ Playtest</button>
        <button id="edSolve">Check solvable</button>
        <button id="edSave">Save</button>
      </div>
      <div class="actions">
        <button id="edNew">New blank</button>
        <button id="edIO">Import / Export</button>
        <button id="edDelete">Delete</button>
      </div>
      <div id="solveOut"></div>
    </div>
  </div>
</section>

<div id="dropMarker"></div>
<dialog id="ioDlg">
  <p style="margin-top:0">Level JSON — copy it out to share, or paste one in and press Import.</p>
  <textarea id="ioText" spellcheck="false"></textarea>
  <div class="actions" style="margin-top:8px;justify-content:flex-end">
    <button id="ioCopy">Copy</button>
    <button id="ioImport" class="primary">Import</button>
    <button id="ioClose">Close</button>
  </div>
</dialog>

<script>
/* =====================================================================
   CONFIG — knobs for experimenting with the design.
   turnMode:  'plan'    → arrange cards into a sequence, then press Play.
              'instant' → clicking a card plays it immediately (with undo).
              'run'     → roguelite run: draw from a deck, generated levels.
   All modes run on the same pure simulation (runCard), so adding a mode
   only means writing a new controller, not touching rules.

   features: switch each experiment off to get back to the earlier game.
     Experiment 1 (puzzle depth): echo, crates, puzzlePack
     Experiment 2 (replayability): runMode
   ===================================================================== */
const CONFIG = {
  turnMode: 'plan',
  features: {
    echo: true,        // "Echo" card: replays the previous card
    crates: true,      // pushable crates (tile C)
    puzzlePack: true,  // levels 3–5, built around echo/crates/decoy cards
    runMode: true,     // "Roguelite" mode: deck, draws, generated levels, rewards
    fairGenerator: true, // generated levels respect your deck's card counts and are play-tested with random draws
    keys: true,        // key (K) + locked door: the flag stays locked until you hold every key
    gems: true,        // optional gems (*) off the easy route, plus scoring
    hints: true,       // Plan & Run: optional hints unlock after a failed run
    timeAttack: true,  // replaces "Instant" with an endless, timed runner (off = old Instant mode)
    shopRun: true,     // Roguelite = route map + buy your hand + Plan & Run + perks (off = older deck-draw roguelite)
  },
  // Shop-run roguelite (features.shopRun)
  quest: {
    hearts: 3,
    startGems: 4,
    handLimit: 10,      // most cards you can own in one level
    prices: { walk1: 1, walk2: 1, walk3: 2, jump: 2, highjump: 3, longjump: 3, turn: 1, wait: 1, echo: 2 },
    shopSize: 6,        // card types on sale per level (always includes everything the cheapest solution needs)
    budgetStart: 1.4,   // level budget = cheapest solution × this…
    budgetEnd: 1.05,    // …narrowing to this…
    budgetRamp: 12,     // …over this many levels
    riskyTighter: 0.1,  // risky routes: smaller margin, but +2 gems on the map and a perk
    gemValue: 2,        // ◆ per gem picked up
    shrineCost: 6,
    carryCap: 12,       // most ◆ you can carry from one level to the next
    perks: {
      legs:     { name: 'Long Legs',     desc: 'Walk cards go 1 tile further', mod: 'walkExtra' },
      spring:   { name: 'Spring Heels',  desc: 'Jump goes 1 tile further', mod: 'jumpExtra' },
      guard:    { name: 'Spike Guard',   desc: 'Survive the first spikes you land on each level', mod: 'shield' },
      double:   { name: 'Head Start',    desc: 'Your first card each level is played twice', mod: 'doubleFirst' },
      thrifty:  { name: 'Thrifty',       desc: 'Walk cards cost 1◆ less' },
      echoes:   { name: 'Echo Discount', desc: 'Echo cards are free' },
      magnet:   { name: 'Gem Magnet',    desc: 'Gems you pick up are worth double' },
      piggy:    { name: 'Piggy Bank',    desc: 'Finish a level with 5◆ or more: +2◆' },
      pockets:  { name: 'Big Pockets',   desc: 'Hold 2 more cards per level' },
      heart:    { name: 'Second Wind',   desc: '+1 max heart, and heal' },
    },
  },
  hints: {
    penalty: 25,       // points taken off the level score per hint used
  },
  timeAttack: {
    handSize: 4,
    hearts: 3,
    startSeconds: 2.5, // time to pick a card at the start…
    minSeconds: 1.2,   // …shrinking to this as you get further
    speedupPerTile: 0.012,
    animSpeed: 0.6,    // animations play faster than in other modes
    pool: { walk1: 2, walk2: 3, walk3: 2, jump: 3, highjump: 2, longjump: 2, wait: 1, echo: 1 },  // draw weights
    pointsPerTile: 10,
    pointsPerGem: 50,
    fairDeal: true,    // if no card in hand is survivable, swap one for a card that is
  },
  score: {
    clear: 100,        // for reaching the flag
    gem: 50,           // per gem
    spare: 10,         // per unused card (Plan/Instant) or unused step (Roguelite)
    allGemsMultiplier: 2,
  },
  run: {
    hearts: 3,
    handSize: 4,
    startingDeck: ['walk1', 'walk1', 'walk2', 'walk2', 'jump', 'jump', 'highjump', 'wait'],
    rewardPool: ['walk3', 'longjump', 'highjump', 'jump', 'walk2', 'wait', 'echo', 'turn'],
    minWinRate: 0.75,  // fairGenerator: a simulated player must win this often with random draws…
    fairTrials: 20,    // …over this many shuffled attempts, or the level is thrown away
    spareSteps: 6,     // step budget = shortest possible solution + this (6 ≈ 80–100% wins for a perfect player)
    // Balance pass (each can be switched off on its own):
    freeSwaps: 2,      // per level: swap ONE card for free (no step, no turn). Mulligan stays as the paid fallback. 0 = off
    peek: 2,           // show the next N cards of the draw pile (0 = off)
    rewardStyle: 'trade', // 'trade': offers explain what they do for the next level; a full deck means giving a card up
                          // 'edit': older add / remove / upgrade screen   'add': just add one of three
    deckLimit: 10,     // 'trade' only: max deck size
    preview: true,     // show the next level before you choose your reward
    healEvery: 3,      // win back a heart every N levels cleared (0 = off)
    minDeck: 6,        // removal can't take the deck below this
    upgrades: { walk1: 'walk2', walk2: 'walk3', jump: 'longjump', wait: 'echo' },
  },
  stepMs: 120,        // animation time per tile moved (walking pace)
  fallMs: 70,         // used for crates and other small drops
  gravityMs: 150,     // time to fall the first tile; later tiles get quicker, like real gravity
  pauseBetweenCards: 50,
};

// ===== SIM-START (pure rules, no DOM — also used by the solver) =====
const W = 16, H = 9;

// Tile legend for level maps:
//   .  empty      #  ground (solid)     ^  spikes (deadly)
//   t  timed spikes: retracted on even turns, up on odd turns (toggle after every card)
//   C  crate: solid, pushed by walking into it; falls; covers spikes it lands on
//   K  key: if a level has keys, the goal is a locked door until all are collected
//   *  gem: optional, worth points
//   P  player start (faces right)       G  goal flag (or door)
// Keys and gems are picked up by passing through their tile, even mid-jump.
// A card is a list of moves. A move is a path of [dx,dy] steps (dx is relative
// to facing), followed by gravity. If a step is blocked, the rest of that path
// is skipped; with stop:true the remaining moves of the card are skipped too.
// push:true lets that step shove a crate.
const step = { path: [[1, 0]], stop: true, push: true };
// Players only see the action name; the picture on the card shows exactly what
// it does. `label` is the specific name, used by the editor and solver output.
const CARDS = {
  walk1:    { name: 'Walk', label: 'Walk 1',    moves: [step] },
  walk2:    { name: 'Walk', label: 'Walk 2',    moves: [step, step] },
  walk3:    { name: 'Walk', label: 'Walk 3',    moves: [step, step, step] },
  jump:     { name: 'Jump', label: 'Jump',      moves: [{ path: [[0,-1],[1,0],[1,0]] }] },
  highjump: { name: 'Jump', label: 'High Jump', moves: [{ path: [[0,-1],[0,-1],[1,0]] }] },
  longjump: { name: 'Jump', label: 'Long Jump', moves: [{ path: [[0,-1],[1,0],[1,0],[1,0]] }] },
  turn:     { name: 'Turn', label: 'Turn',      moves: [{ type: 'turn' }] },
  wait:     { name: 'Wait', label: 'Wait',      moves: [{ type: 'wait' }] },
  echo:     { name: 'Echo', label: 'Echo',      echo: true, moves: [] },
};
if (!CONFIG.features.echo) delete CARDS.echo;

function parseLevel(level) {
  const grid = [], map = { grid, w: W, start: { x: 0, y: 0 }, goal: { x: -1, y: -1 }, crates: [], items: [], keyMask: 0 };
  for (let y = 0; y < H; y++) {
    const row = (level.map[y] || '').padEnd(W, '.').slice(0, W).split('');
    row.forEach((c, x) => {
      if (c === 'P') { map.start = { x, y }; row[x] = '.'; }
      if (c === 'G') { map.goal = { x, y }; row[x] = '.'; }
      if (c === 'C') { if (CONFIG.features.crates) map.crates.push({ x, y }); row[x] = '.'; }
      if (c === 'K' || c === '*') {
        if (c === 'K' ? CONFIG.features.keys : CONFIG.features.gems) {
          if (c === 'K') map.keyMask |= 1 << map.items.length;
          map.items.push({ x, y, t: c });
        }
        row[x] = '.';
      }
    });
    grid.push(row);
  }
  return map;
}

function initialState(map) {
  const s = { x: map.start.x, y: map.start.y, dir: 1, turn: 0, status: 'playing', last: null, got: 0, n: 0,
    shield: map.mods?.shield ? 1 : 0, crates: map.crates.map((c) => ({ ...c })) };
  settleCrates(map, s, []);
  return s;
}

// s.got is a bitmask over map.items (keys and gems collected so far).
const hasAllKeys = (map, s) => (s.got & map.keyMask) === map.keyMask;
const gemCount = (map, s) => map.items.filter((it, i) => it.t === '*' && s.got & (1 << i)).length;
const gemTotal = (map) => map.items.filter((it) => it.t === '*').length;
const stateKey = (s) => `${s.x},${s.y},${s.dir},${s.turn % 2},${s.last},${s.got},${s.n ? 1 : 0},${s.shield || 0},${s.crates.map((c) => c.gone ? '_' : c.x + ':' + c.y).join(';')}`;

function wall(map, x, y) {
  if (x < 0 || x >= map.w) return true;      // side walls
  if (y < 0 || y >= H) return false;         // open sky / bottomless pit
  return map.grid[y][x] === '#';
}
const crateAt = (s, x, y) => s.crates.findIndex((c) => !c.gone && c.x === x && c.y === y);
const solid = (map, s, x, y) => wall(map, x, y) || crateAt(s, x, y) >= 0;

function spikeUp(map, s, x, y) {
  if (x < 0 || x >= map.w || y < 0 || y >= H || crateAt(s, x, y) >= 0) return false;
  const c = map.grid[y][x];
  return c === '^' || (c === 't' && s.turn % 2 === 1);
}

// Drop every unsupported crate (bottom-most first so stacks fall together).
function settleCrates(map, s, ev) {
  let moved = true;
  while (moved) {
    moved = false;
    [...s.crates.keys()].sort((a, b) => s.crates[b].y - s.crates[a].y).forEach((i) => {
      const c = s.crates[i];
      if (c.gone) return;
      const by = c.y + 1;
      if (wall(map, c.x, by) || crateAt(s, c.x, by) >= 0 || (s.x === c.x && s.y === by)) return;
      c.y = by; moved = true;
      if (c.y >= H) { c.gone = true; ev.push({ k: 'cgone', i }); }
      else ev.push({ k: 'cfall', i, x: c.x, y: c.y });
    });
  }
}

// Runs one card. Returns the new state plus a list of events for animation.
function runCard(map, st, id) {
  const s = { ...st, crates: st.crates.map((c) => ({ ...c })) }, ev = [];
  let card = CARDS[id], resolved = id;
  if (card.echo) {
    ev.push({ k: 'echo', x: s.x, y: s.y, of: s.last });
    resolved = s.last || 'wait';                   // nothing to echo → wasted turn
    card = CARDS[resolved];
  } else s.last = id;
  // perks (shop runs) can change what cards do; map.mods is absent everywhere else
  let moves = card.moves;
  const mods = map.mods;
  if (mods) {
    if (mods.walkExtra && resolved.startsWith('walk')) moves = [...moves, step];
    if (mods.jumpExtra && resolved === 'jump') moves = [{ path: [...moves[0].path, [1, 0]] }];
    if (mods.doubleFirst && !s.n) { moves = [...moves, ...moves]; ev.push({ k: 'double', x: s.x, y: s.y }); }
  }
  s.n++;
  const check = () => {
    if (spikeUp(map, s, s.x, s.y)) {
      if (s.shield > 0 && !s.shielded) { s.shield--; s.shielded = true; ev.push({ k: 'shield', x: s.x, y: s.y }); }   // Spike Guard perk
      else if (!s.shielded) { s.status = 'dead'; s.why = 'spikes'; ev.push({ k: 'die', x: s.x, y: s.y }); return true; }
    } else s.shielded = false;
    map.items.forEach((it, i) => {
      if (it.x === s.x && it.y === s.y && !(s.got & (1 << i))) { s.got |= 1 << i; ev.push({ k: 'collect', i, t: it.t, x: s.x, y: s.y }); }
    });
    if (s.x === map.goal.x && s.y === map.goal.y) {
      if (hasAllKeys(map, s)) { s.status = 'won'; ev.push({ k: 'win', x: s.x, y: s.y }); return true; }
      if (!ev.some((e) => e.k === 'locked')) ev.push({ k: 'locked', x: s.x, y: s.y });
    }
    return false;
  };
  const fall = () => {
    while (!solid(map, s, s.x, s.y + 1)) {
      s.y++; ev.push({ k: 'fall', x: s.x, y: s.y });
      if (s.y >= H) { s.status = 'dead'; s.why = 'pit'; ev.push({ k: 'die', x: s.x, y: s.y }); return true; }
      if (check()) return true;
    }
    return false;
  };
  for (const m of moves) {
    if (m.type === 'turn') { s.dir = -s.dir; ev.push({ k: 'turn', x: s.x, y: s.y, dir: s.dir }); continue; }
    if (m.type === 'wait') { ev.push({ k: 'wait', x: s.x, y: s.y }); continue; }
    let blocked = false;
    for (const [dx, dy] of m.path) {
      const nx = s.x + dx * s.dir, ny = s.y + dy;
      const ci = crateAt(s, nx, ny);
      if (ci >= 0 && m.push && dy === 0 && !solid(map, s, nx + dx * s.dir, ny)) {
        const c = s.crates[ci];
        c.x = nx + dx * s.dir;
        s.x = nx; ev.push({ k: 'push', x: s.x, y: s.y, i: ci, cx: c.x, cy: c.y });
        settleCrates(map, s, ev);
        if (check()) return { state: s, ev };
        continue;
      }
      if (solid(map, s, nx, ny)) { ev.push({ k: 'bump', x: s.x, y: s.y, dx: dx * s.dir, dy }); blocked = true; break; }
      s.x = nx; s.y = ny; ev.push({ k: 'move', x: s.x, y: s.y });
      if (check()) return { state: s, ev };
    }
    if (fall()) return { state: s, ev };
    settleCrates(map, s, ev);
    if (blocked && m.stop) break;
  }
  s.turn++; ev.push({ k: 'tick', x: s.x, y: s.y, turn: s.turn });
  check(); // timed spikes may pop up underneath you
  return { state: s, ev };
}

// Depth-first search over every order of the hand. A sequence counts as a
// solution as soon as it reaches the flag (leftover cards are allowed).
function solve(level, limit = 200) {
  const map = parseLevel(level), sols = [], counts = {};
  let explored = 0;
  for (const c of level.cards) counts[c] = (counts[c] || 0) + 1;
  const dfs = (st, seq) => {
    for (const id in counts) {
      if (!counts[id] || sols.length >= limit) continue;
      explored++;
      const r = runCard(map, st, id);
      seq.push(id); counts[id]--;
      if (r.state.status === 'won') sols.push(Object.assign([...seq], { gems: gemCount(map, r.state) }));
      else if (r.state.status === 'playing') dfs(r.state, seq);
      seq.pop(); counts[id]++;
    }
  };
  dfs(initialState(map), []);
  return { solutions: sols, explored, gemTotal: gemTotal(map), bestGems: Math.max(0, ...sols.map((x) => x.gems)) };
}

// Breadth-first search with unlimited copies of each card type: the fewest
// cards that can possibly finish the level. Used to vet generated levels.
// Can the flag still be reached from state s within maxDepth cards of these types?
function canFinish(map, s0, types, maxDepth) {
  if (s0.status === 'won') return true;
  let frontier = [s0];
  const seen = new Set([stateKey(s0)]);
  for (let d = 0; d < maxDepth && frontier.length; d++) {
    const next = [];
    for (const s of frontier) for (const id of types) {
      const r = runCard(map, s, id);
      if (r.state.status === 'won') return true;
      if (r.state.status !== 'playing') continue;
      const k = stateKey(r.state);
      if (!seen.has(k)) { seen.add(k); next.push(r.state); }
    }
    frontier = next;
  }
  return false;
}

// Cheapest set of cards that finishes the level, if every card in `prices`
// can be bought as often as you like (up to maxCards cards). Used by shop runs.
// needMask: items (bitmask over map.items) that must be collected before the flag counts
function cheapestSolution(map, prices, maxCards, needMask = 0) {
  const types = Object.keys(prices);
  const buckets = [[{ s: initialState(map), seq: [] }]];      // buckets[cost] = nodes; prices are small integers
  const best = new Map();
  for (let cost = 0; cost < buckets.length; cost++) {
    for (const cur of buckets[cost] || []) {
      if (cur.won) return { cost, seq: cur.seq };
      if (cur.seq.length >= maxCards) continue;
      for (const id of types) {
        const r = runCard(map, cur.s, id), c = cost + prices[id], seq = [...cur.seq, id];
        if (r.state.status !== 'playing' && r.state.status !== 'won') continue;
        if (r.state.status === 'won' && (r.state.got & needMask) !== needMask) continue;   // finished without the required pickup
        const k = r.state.status === 'won' ? 'won' : stateKey(r.state);
        // skip only if an earlier visit was at least as cheap AND used no more cards
        // (both matter: a pricier path with fewer cards can still fit the hand limit)
        const seen = best.get(k) || [];
        if (seen.some((e) => e.c <= c && e.n <= seq.length)) continue;
        best.set(k, [...seen.filter((e) => !(c <= e.c && seq.length <= e.n)), { c, n: seq.length }]);
        if (!buckets[c]) buckets[c] = [];
        buckets[c].push({ s: r.state, seq, won: r.state.status === 'won' });
      }
    }
  }
  return null;
}

// Remove gems no card sequence can collect while still finishing the level.
// Returns the cleaned level plus, for each kept gem, a sequence that collects it.
function pruneGems(level, prices, maxCards, mods) {
  const map = parseLevel(level);
  if (mods) map.mods = mods;
  const rows = level.map.map((r) => r.split('')), routes = [];
  map.items.forEach((it, i) => {
    if (it.t !== '*') return;
    const sol = cheapestSolution(map, prices, maxCards, 1 << i);
    if (sol) routes.push(sol.seq); else rows[it.y][it.x] = '.';
  });
  return { level: { ...level, map: rows.map((r) => r.join('')) }, routes };
}

function shortestPath(level, types, maxDepth = 16) {
  const map = parseLevel(level);
  const key = stateKey;
  let frontier = [{ s: initialState(map), seq: [] }];
  const seen = new Set([key(frontier[0].s)]);
  for (let d = 0; d < maxDepth && frontier.length; d++) {
    const next = [];
    for (const { s, seq } of frontier) for (const id of types) {
      const r = runCard(map, s, id);
      if (r.state.status === 'won') return [...seq, id];
      if (r.state.status !== 'playing') continue;
      const k = key(r.state);
      if (!seen.has(k)) { seen.add(k); next.push({ s: r.state, seq: [...seq, id] }); }
    }
    frontier = next;
  }
  return null;
}

// Random level for roguelite runs: left-to-right terrain built only from moves
// the deck can make, then kept only if shortestPath finds a route.
// With fairGenerator on, obstacles are also capped by how many of each jump
// card the deck holds (one High Jump → at most one tall step), and the level
// must pass drawOdds() so it's winnable with the luck of the draw.
function generateLevel(depth, deck, rand = Math.random, opts = {}) {
  const types = [...new Set(deck)];
  const fair = CONFIG.features.fairGenerator && !opts.skipOdds;   // shop runs have no random draws to test
  const has = (id) => types.includes(id);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  let best = null;
  for (let attempt = 0; attempt < 400; attempt++) {
    // obstacle budget: each obstacle spends one card that can clear it
    const budget = {};
    for (const id of deck) budget[id] = (budget[id] || 0) + 1;
    const spend = (...ids) => {
      if (!fair) return ids.some(has);
      const id = ids.find((i) => budget[i] > 0);
      if (id) budget[id]--;
      return !!id;
    };
    const rows = Array.from({ length: H }, () => Array(W).fill('.'));
    let top = 7 - Math.floor(rand() * 2);   // row of the top ground tile
    const column = (x, t) => { for (let y = t; y < H; y++) rows[y][x] = '#'; };
    column(0, top); column(1, top);
    let x = 2;
    const danger = Math.min(.15 + depth * .07, .5);
    while (x < W - 2) {
      const opts = ['flat', 'flat', 'up', 'down', 'gap'];
      if (rand() < danger) opts.push('spike', 'spike', 'timed');
      if (CONFIG.features.crates && depth >= 2 && rand() < .3) opts.push('crate');
      let f = pick(opts);
      if (f === 'gap') {
        const wide = rand() < .5 && spend('longjump');
        if (wide || spend('jump', 'longjump')) x += wide ? 2 : 1;   // leave columns empty → pit
        else f = 'flat';
      } else if (f === 'up') {
        const tall = rand() < .5 && spend('highjump');
        if (tall || spend('jump', 'highjump', 'longjump')) { top = Math.max(3, top - (tall ? 2 : 1)); column(x, top); x++; }
        else f = 'flat';
      } else if (f === 'down') {
        top = Math.min(8, top + 1 + Math.floor(rand() * 2)); column(x, top); x++;
      } else if (f === 'spike' || f === 'timed') {
        if (f === 'spike' && !spend('jump', 'longjump')) f = 'flat';
        else { column(x, top); rows[top - 1][x] = f === 'spike' ? '^' : 't'; x++; }
      } else if (f === 'crate') {
        column(x, top); column(x + 1, top); rows[top - 1][x] = 'C'; x += 2;
      }
      if (f === 'flat') {
        const n = 1 + Math.floor(rand() * 2);
        for (let i = 0; i < n && x < W - 2; i++, x++) column(x, top);
      }
    }
    for (; x < W; x++) column(x, top);
    rows[top - 1][W - 1] = 'G';             // last column: the wall stops you overshooting it
    const standY = (cx) => { const t = rows.findIndex((r) => r[cx] === '#'); return t > 0 ? t - 1 : -1; };
    const free = (cx, cy) => cy >= 0 && rows[cy][cx] === '.';
    let px = 0;
    // Key: either behind the start (needs two Turns) or floating one tile up (jump through it)
    if (CONFIG.features.keys && depth >= 2 && rand() < .6) {
      const behind = has('turn') && rand() < .5 && [0, 1, 2, 3].every((c) => free(c, standY(c))) && spend('turn') && spend('turn');
      if (behind) { px = 3; rows[standY(0)][0] = 'K'; }
      else {
        const xs = [];
        for (let c = 3; c < W - 3; c++) if (free(c, standY(c)) && free(c, standY(c) - 1)) xs.push(c);
        if (xs.length && spend('jump', 'highjump', 'longjump')) { const c = pick(xs); rows[standY(c) - 1][c] = 'K'; }
      }
    }
    // Gems: floating 1 or 2 tiles up, so grabbing one means jumping where you'd rather walk
    if (CONFIG.features.gems) {
      for (let n = (rand() < .4 ? 2 : 1) + (opts.extraGems || 0); n > 0; n--) {
        const c = 2 + Math.floor(rand() * (W - 5)), h = has('highjump') && rand() < .5 ? 2 : 1;
        if (standY(c) >= 0 && free(c, standY(c) - h) && free(c, standY(c))) rows[standY(c) - h][c] = '*';
      }
    }
    rows[standY(px)][px] = 'P';
    const level = { name: `Run level ${depth}`, map: rows.map((r) => r.join('')), cards: [] };
    const path = shortestPath(level, types, 14);
    const minLen = Math.min(3 + Math.floor(depth / 2), 7);
    if (!path || path.length < minLen) continue;
    const unit = Object.fromEntries(types.map((id) => [id, 1]));
    const finish = (gn) => (opts.keepGems || !CONFIG.features.gems ? gn : { ...gn, level: pruneGems(gn.level, unit, 14).level });
    const gen = { level, par: path.length, path };
    if (!fair) return finish(gen);
    gen.odds = drawOdds(level, gen.par, deck, CONFIG.run.fairTrials, rand);
    if (gen.odds >= CONFIG.run.minWinRate) return finish(gen);
    if (!best || gen.odds > best.odds) best = gen;
    if (attempt >= 60 && best) break;      // keep load times short: settle for the fairest seen
  }
  if (best && CONFIG.features.gems) best.level = pruneGems(best.level, Object.fromEntries(types.map((id) => [id, 1])), 14).level;
  return best;
}

// Plays a level many times with shuffled draws, the way a careful player
// would: play the card that gets closest to the flag, mulligan if none helps.
// Returns the fraction of attempts that reach the flag within the step budget.
function drawOdds(level, par, deck, trials, rand = Math.random) {
  const map = parseLevel(level), types = [...new Set(deck)];
  const key = stateKey;
  const memo = new Map();
  const dist = (s0) => {                   // fewest cards to the flag with any draws
    const k0 = key(s0);
    if (memo.has(k0)) return memo.get(k0);
    let frontier = [s0], d = 0, found = 99;
    const seen = new Set([k0]);
    search: while (frontier.length && ++d <= 14) {
      const next = [];
      for (const s of frontier) for (const id of types) {
        const r = runCard(map, s, id);
        if (r.state.status === 'won') { found = d; break search; }
        if (r.state.status !== 'playing') continue;
        const k = key(r.state);
        if (!seen.has(k)) { seen.add(k); next.push(r.state); }
      }
      frontier = next;
    }
    memo.set(k0, found);
    return found;
  };
  const shuffled = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let wins = 0;
  for (let t = 0; t < trials; t++) {
    let s = initialState(map), draw = shuffled(deck), disc = [], hand = [], steps = par + CONFIG.run.spareSteps, swaps = CONFIG.run.freeSwaps;
    const fill = () => { while (hand.length < CONFIG.run.handSize) { if (!draw.length) { if (!disc.length) break; draw = shuffled(disc); disc = []; } hand.push(draw.pop()); } };
    fill();
    while (steps-- > 0 && s.status === 'playing') {
      let bestId = null, bestState = null, bd = dist(s);
      for (const id of new Set(hand)) {
        const r = runCard(map, s, id);
        if (r.state.status === 'won') { bestId = id; bestState = r.state; break; }
        if (r.state.status !== 'playing') continue;
        const d = dist(r.state);
        if (d < bd) { bd = d; bestId = id; bestState = r.state; }
      }
      if (bestId) { hand.splice(hand.indexOf(bestId), 1); disc.push(bestId); s = bestState; }
      else if (swaps > 0) { swaps--; steps++; disc.push(hand.splice(Math.floor(rand() * hand.length), 1)[0]); }   // free swap
      else { disc.push(...hand); hand = []; const last = s.last; s = runCard(map, s, 'wait').state; s.last = last; }
      fill();
    }
    if (s.status === 'won') wins++;
  }
  return wins / trials;
}
// Endless terrain for Time Attack: the map grows to the right as you go.
// Every obstacle can be cleared by some card in the draw pool.
function makeEndlessMap(rand = Math.random) {
  const map = { grid: Array.from({ length: H }, () => []), w: 0, start: { x: 1, y: 6 }, goal: { x: -1, y: -1 },
    crates: [], items: [], keyMask: 0, gen: { top: 7 } };
  extendTerrain(map, W + 6, rand);
  return map;
}
function extendTerrain(map, upto, rand = Math.random) {
  const g = map.gen;
  const col = (t, mark) => { for (let y = 0; y < H; y++) map.grid[y].push(y >= t ? '#' : '.'); if (mark) map.grid[t - 1][map.w] = mark; map.w++; };
  const gap = () => { for (let y = 0; y < H; y++) map.grid[y].push('.'); map.w++; };
  if (map.w === 0) for (let i = 0; i < 6; i++) col(g.top);
  while (map.w < upto) {
    const hard = Math.min(1, map.w / 300), r = rand();
    if (r < .25) {
      for (let n = 1 + Math.floor(rand() * 3); n > 0; n--) col(g.top);
      if (rand() < .3) map.items.push({ x: map.w - 1, y: g.top - (rand() < .5 ? 2 : 3), t: '*' });   // jump for it
    } else if (r < .40) { g.top = Math.max(3, g.top - (rand() < .35 ? 2 : 1)); col(g.top); col(g.top); }
    else if (r < .52) { g.top = Math.min(8, g.top + 1 + Math.floor(rand() * 2)); col(g.top); col(g.top); }
    else if (r < .72) { for (let n = rand() < .35 + hard * .3 ? 2 : 1; n > 0; n--) gap(); col(g.top); col(g.top); }
    else if (r < .86) { col(g.top, '^'); col(g.top); }
    else { col(g.top, 't'); col(g.top); }
  }
}
// ===== SIM-END =====

const BASE_LEVELS = [
  {
    name: '1. Mind the Gap',
    hint: 'The pit is two tiles wide, so only one card can clear it. Where do you need to be standing first?',
    map: [
      '................',
      '................',
      '.........*......',
      '................',
      '...........G....',
      '.........#######',
      '.........#######',
      '.P......########',
      '####..##########',
    ],
    cards: ['jump', 'walk2', 'highjump', 'walk2', 'longjump'],
    gemBonus: ['echo'],               // extra card dealt only when gems are on
  },

/* =====================================================================
   Animation — plays the event list from runCard on the view
   ===================================================================== */
const animSpeed = () => (app.mode === 'time' ? CONFIG.timeAttack.animSpeed : 1);
const nap = (ms) => sleep(ms * animSpeed());
function tween(ms, fn) {
  ms *= animSpeed();
  return new Promise((res) => {
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / ms);
      fn(t);
      t < 1 ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
}
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---------------------------------------------------------------------
// Fluid playback. The rules move in whole tiles; here we turn each card's
// run of moves into one continuous, curved motion (Catmull-Rom spline through
// the tiles), with walking at a steady pace and falls accelerating like
// gravity. Pickups, crate falls and the turn tick fire as the path reaches
// them instead of stopping the motion. Bumps, turns, waits, death and the
// win still play as their own little beats.
// ---------------------------------------------------------------------
const MOTION = new Set(['move', 'fall', 'push']);
const ALONG = new Set(['collect', 'tick', 'double', 'cfall', 'cgone']);   // happen mid-motion

async function animate(ev) {
  let i = 0;
  while (i < ev.length) {
    if (MOTION.has(ev[i].k)) {
      const run = [];
      while (i < ev.length && (MOTION.has(ev[i].k) || ALONG.has(ev[i].k))) run.push(ev[i++]);
      await glide(run);
    } else await beat(ev[i++]);
  }
}

const groundBelow = (x, y) => y + 1 >= H ? false : wall(app.map, x, y + 1) || app.view.crates.some((c) => !c.gone && Math.round(c.x) === x && Math.round(c.y) === y + 1);

function glide(run) {
  const v = app.view, speed = animSpeed();
  const pts = [{ x: v.x, y: v.y }], segs = [], along = [];   // along[j]: events to fire on reaching point j
  let falls = 0;
  for (const e of run) {
    if (!MOTION.has(e.k)) { (along[pts.length - 1] = along[pts.length - 1] || []).push(e); continue; }
    const from = pts[pts.length - 1];
    let ms;
    if (e.k === 'fall') { falls++; ms = CONFIG.gravityMs * (Math.sqrt(falls) - Math.sqrt(falls - 1)); }
    else { falls = 0; ms = CONFIG.stepMs * (e.k === 'push' ? 1.3 : e.y < from.y ? .95 : 1); }
    segs.push({ ms: ms * speed, kind: e.k, push: e.k === 'push' ? e : null,
      ground: e.k !== 'fall' && e.y === from.y && groundBelow(e.x, e.y) && groundBelow(from.x, from.y) });
    pts.push({ x: e.x, y: e.y });
  }
  // the top of a rise slows down, like gravity pulling against it
  segs.forEach((g, j) => {
    const up = pts[j + 1].y < pts[j].y, nextUp = segs[j + 1] && pts[j + 2].y < pts[j + 1].y;
    if (up && !nextUp) { g.ms *= 1.25; g.apex = true; }
    else if (up && j > 0 && !(pts[j].y < pts[j - 1].y)) g.ms *= .8;     // quick take-off
  });
  const total = segs.reduce((a, g) => a + g.ms, 0);
  // Rounded corners: wherever the path changes direction, swap the sharp corner
  // for a quadratic curve ~half a tile across (it cuts the corner by ~1/6 tile).
  const R = .45, dirOf = (a, b) => ({ x: Math.sign(b.x - a.x), y: Math.sign(b.y - a.y) });
  const corner = (j) => {
    if (j <= 0 || j >= pts.length - 1) return null;
    const di = dirOf(pts[j - 1], pts[j]), dout = dirOf(pts[j], pts[j + 1]);
    if (di.x === dout.x && di.y === dout.y) return null;
    const P = pts[j];
    return { A: { x: P.x - di.x * R, y: P.y - di.y * R }, P, B: { x: P.x + dout.x * R, y: P.y + dout.y * R } };
  };
  const bez = (c, u) => ({ x: (1 - u) * (1 - u) * c.A.x + 2 * u * (1 - u) * c.P.x + u * u * c.B.x, y: (1 - u) * (1 - u) * c.A.y + 2 * u * (1 - u) * c.P.y + u * u * c.B.y });
  // Mid-air sideways stretches (e.g. across a gap) get a gentle arc on top,
  // so a long jump reads as a jump rather than a flat glide.
  const hump = [];
  for (let j = 0; j < segs.length;) {
    const flatAir = (q) => segs[q] && !segs[q].ground && pts[q + 1].y === pts[q].y;
    if (!flatAir(j)) { j++; continue; }
    let k = j; while (flatAir(k)) k++;
    for (let q = j; q < k; q++) hump[q] = { start: j, len: k - j, h: Math.min(.45, .2 + .08 * (k - j)) };
    j = k;
  }
  const at = (j, t) => {
    const a = pts[j], b = pts[j + 1], cs = corner(j), ce = corner(j + 1);
    let p;
    if (cs && t < R) p = bez(cs, .5 + .5 * t / R);                     // leaving the previous corner
    else if (ce && t > 1 - R) p = bez(ce, .5 * (t - (1 - R)) / R);     // entering the next one
    else p = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    const hm = hump[j];
    if (hm) p.y -= hm.h * Math.sin(Math.PI * (j - hm.start + t) / hm.len);
    return p;
  };
  const fire = (j) => {
    const evs = along[j]; along[j] = null;
    if (!evs) return;
    const drops = {};
    for (const e of evs) {
      if (e.k === 'cfall') drops[e.i] = e;            // a crate falling several tiles: one smooth drop
      else beatNow(e);
    }
    for (const i in drops) dropCrate(+i, drops[i].y);
  };
  fire(0);
  return new Promise((resolve) => {
    const t0 = performance.now();
    let lastSeg = -1, prev = { x: v.x, y: v.y, t: t0 };
    const frame = (now) => {
      let el = Math.min(total, now - t0), j = 0;
      while (j < segs.length - 1 && el > segs[j].ms) { el -= segs[j].ms; j++; }
      for (let q = lastSeg + 1; q <= j; q++) if (q > 0) {          // reached point q
        fire(q);
        if (!segs[q - 1].ground && segs[q].ground) land();          // came down onto solid ground
      }
      lastSeg = Math.max(lastSeg, j);
      const g = segs[j];
      let t = g.ms ? Math.min(1, el / g.ms) : 1;
      if (g.apex) t = 1 - (1 - t) * (1 - t);                                     // slowing at the top of a rise
      else if (j === segs.length - 1 && g.ground) t = 1 - (1 - t) * (1 - t);     // ease to a stop when walking
      const p = at(j, t);
      v.x = p.x; v.y = p.y;
      if (g.push) { const c = v.crates[g.push.i]; c.x = g.push.cx - Math.sign(g.push.cx - g.push.x) * (1 - t); }
      if (g.ground) v.bob = (v.bob || 0) + Math.abs(p.x - prev.x) * Math.PI;   // footsteps
      const dt = Math.max(1, now - prev.t) / 1000;
      v.vx = (p.x - prev.x) / dt; v.vy = (p.y - prev.y) / dt;
      v.air = !g.ground;
      prev = { x: p.x, y: p.y, t: now };
      if (now - t0 < total) return requestAnimationFrame(frame);
      const end = pts[pts.length - 1];
      v.x = end.x; v.y = end.y; v.vx = v.vy = 0; v.air = false;
      fire(pts.length - 1);
      if (!segs[segs.length - 1].ground && end.y < H && groundBelow(end.x, end.y)) land();
      resolve();
    };
    requestAnimationFrame(frame);
  });
}

function land() {
  const v = app.view;
  v.landT = performance.now();
  for (let i = 0; i < 8; i++) {      // a puff of dust at the feet
    const side = i % 2 ? 1 : -1;
    app.particles.push({ x: v.x + .5 + side * .2, y: v.y + .95, vx: side * (.02 + Math.random() * .03), vy: -Math.random() * .03, life: .6, color: '#c9b38f' });
  }
}

function dropCrate(i, toY) {
  const c = app.view.crates[i], fy = c.y, n = Math.max(1, toY - fy);
  tween(CONFIG.gravityMs * Math.sqrt(n), (t) => { c.y = fy + (toY - fy) * t * t; }).then(() => { c.y = toY; });
}

// Events that just happen (no waiting)
function beatNow(e) {
  const v = app.view;
  if (e.k === 'tick') v.turn = e.turn;
  else if (e.k === 'cgone') v.crates[e.i].gone = true;
  else if (e.k === 'cfall') dropCrate(e.i, e.y);
  else if (e.k === 'double') app.flash = { text: 'Head Start: ×2', t0: performance.now() };
  else if (e.k === 'collect') {
    v.got |= 1 << e.i;
    burst(e.x, e.y, e.t === 'K' ? '#ffcc33' : '#4fd8e8');
    app.flash = { text: e.t === 'K' ? 'Got the key!' : `Gem! +${CONFIG.score.gem}`, t0: performance.now() };
  }
}

// Events that are their own little moment
async function beat(e) {
  const v = app.view;
  if (ALONG.has(e.k)) return beatNow(e);
  if (e.k === 'bump') {
    await tween(CONFIG.stepMs * 1.1, (t) => { const k = Math.sin(t * Math.PI) * .18; v.ox = e.dx * k; v.oy = e.dy * k; });
    v.ox = v.oy = 0; v.landT = performance.now() - 80;     // a little wobble from the knock
  } else if (e.k === 'turn') {
    await tween(150, (t) => { v.flip = Math.abs(1 - 2 * t); if (t >= .5) v.dir = e.dir; });
    v.flip = 1; v.dir = e.dir;
  } else if (e.k === 'wait') {
    await tween(CONFIG.stepMs * 2.2, (t) => { v.oy = -Math.abs(Math.sin(t * Math.PI * 2)) * .1; });
    v.oy = 0;
  } else if (e.k === 'shield') {
    app.flash = { text: 'Spike Guard!', t0: performance.now() }; burst(e.x, e.y, '#4fd8e8');
    await nap(CONFIG.stepMs);
  } else if (e.k === 'locked') {
    app.flash = { text: 'Locked — find the key', t0: performance.now() };
    await nap(CONFIG.stepMs);
  } else if (e.k === 'echo') {
    app.flash = { text: e.of ? 'Echo!' : 'Echo: nothing to repeat', t0: performance.now() };
    await nap(CONFIG.stepMs * 1.2);
  } else if (e.k === 'die') {
    v.status = 'dead';
    burst(e.x, Math.min(e.y, H - 1), '#ff6b6b');
    await tween(260, (t) => { v.ox = Math.sin(t * Math.PI * 6) * .08 * (1 - t); });   // a shudder
    v.ox = 0;
    await nap(250);
  } else if (e.k === 'win') {
    v.status = 'won';
    burst(e.x, e.y, '#ffcc33'); burst(e.x, e.y, '#5cd18b');
    await tween(420, (t) => { v.oy = -Math.sin(t * Math.PI) * .6; });          // a hop of joy
    v.oy = 0; v.landT = performance.now();
    await nap(150);
  }
}

async function playCard(id) {
  const r = runCard(app.map, app.state, id);
  await animate(r.ev);
  app.state = r.state;
  Object.assign(app.view, { x: r.state.x, y: r.state.y, dir: r.state.dir, turn: r.state.turn, status: r.state.status, got: r.state.got, crates: clone(r.state.crates) });
  return r.state.status;
}

/* =====================================================================
   Controllers — one per turn mode
   ===================================================================== */
const Plan = {
  clickHand(uid, at = app.seq.length) {
    if (app.running) return;
    const i = app.hand.findIndex((c) => c.uid === uid);
    app.seq.splice(at, 0, ...app.hand.splice(i, 1));
    if (app.cursor) resetRun(); else renderDeck();
  },
  moveTo(uid, at) {
    if (app.running) return;
    const card = app.seq.splice(app.seq.findIndex((c) => c.uid === uid), 1)[0];
    app.seq.splice(at, 0, card);
    if (app.cursor || app.state.status !== 'playing') resetRun(); else renderDeck();
  },
  clickSeq(uid) {
    if (app.running) return;
    const i = app.seq.findIndex((c) => c.uid === uid);
    app.hand.push(...app.seq.splice(i, 1));
    app.hand.sort((a, b) => a.uid - b.uid);
    if (app.cursor) resetRun(); else renderDeck();
  },
  async play() {
    if (app.running || !app.seq.length) return;
    hideBanner();
    if (app.cursor || app.state.status !== 'playing') resetRun();
    while (app.cursor < app.seq.length && await Plan.step(true) === 'playing') await sleep(CONFIG.pauseBetweenCards);
  },
  async step(fromPlay) {
    if (app.running && !fromPlay) return;
    if (app.state.status !== 'playing') resetRun();
    if (app.cursor >= app.seq.length) return;
    app.running = true; renderDeck();
    const status = await playCard(app.seq[app.cursor].id);
    app.cursor++; app.running = false;
    finishCheck(status, app.cursor >= app.seq.length, app.hand.length);
    renderDeck();
    return status;
  },
  clear() { if (app.running) return; app.hand.push(...app.seq); app.seq = []; app.hand.sort((a, b) => a.uid - b.uid); resetRun(); },
  actions() {
    return [
      ['▶ Play', 'primary', Plan.play, !app.seq.length || app.running],
      ['Step', '', () => Plan.step(), !app.seq.length || app.running || (app.cursor >= app.seq.length && app.state.status === 'playing')],
      ['↺ Reset', '', resetRun, app.running],
      ['Clear', '', Plan.clear, app.running || !app.seq.length],
      ...(CONFIG.features.hints && app.fails > 0 ? [[`💡 Hint${CONFIG.features.gems ? ` (−${CONFIG.hints.penalty})` : ''}`, '', Hints.next, app.running]] : []),
    ];
  },
};

// Hints (Plan & Run): unlocked after a failed run, each one costs points.
// First hint is the level's own nudge (if it has one); after that, compare
// the player's sequence with the closest solution and reveal one more card.
const Hints = {
  available: () => CONFIG.features.hints && app.mode === 'plan' && app.fails > 0 && !app.running,
  next() {
    if (!Hints.available()) return;
    app.hintsUsed++;
    if (app.hintsUsed === 1 && app.level.hint) { app.hintText = app.level.hint; app.hintHtml = null; renderDeck(); return; }
    if (!app.hintSols) app.hintSols = solve(app.level, 2000).solutions.sort((a, b) => a.length - b.length);
    const sols = app.hintSols;
    if (!sols.length) { app.hintText = "These cards can't reach the flag — the level may need editing."; renderDeck(); return; }
    const seq = app.seq.map((c) => c.id);
    const prefix = (sol) => { let k = 0; while (k < seq.length && k < sol.length && sol[k] === seq[k]) k++; return k; };
    const sol = sols.reduce((best, x) => (prefix(x) > prefix(best) ? x : best), sols[0]);
    const k = prefix(sol);
    app.hintReveal = Math.min(sol.length, Math.max(k + 1, app.hintReveal + 1));
    const shown = sol.slice(0, app.hintReveal).map(cardChip);
    app.hintHtml = (k > 1 ? `Your first ${k} cards are right. ` : k ? 'Your first card is right. ' : seq.length ? 'Your first card is off. ' : '')
      + `A working start: ${shown.join(' → ')}${app.hintReveal < sol.length ? ' → …' : ' (that\'s the whole solution)'}`;
    app.hintText = 'cards';
    app.hintNext = sol[k] || null;
    renderDeck();
  },
};

const Instant = {
  async clickHand(uid) {
    if (app.running || app.state.status !== 'playing') return;
    app.history.push({ state: { ...app.state }, hand: [...app.hand], played: [...app.played] });
    const i = app.hand.findIndex((c) => c.uid === uid);
    const card = app.hand.splice(i, 1)[0];
    app.played.push(card);
    app.running = true; renderDeck();
    const status = await playCard(card.id);
    app.running = false;
    finishCheck(status, !app.hand.length, 0);
    renderDeck();
  },
  clickSeq() {},
  undo() {
    if (app.running || !app.history.length) return;
    const h = app.history.pop();
    app.state = h.state; app.hand = h.hand; app.played = h.played;
    app.view = { ...clone(app.state), ox: 0, oy: 0 }; app.particles = [];
    hideBanner(); renderDeck();
  },
  restart() {
    if (app.running) return;
    app.hand.push(...app.played); app.played = []; app.history = [];
    app.hand.sort((a, b) => a.uid - b.uid);
    resetRun();
  },
  actions() {
    return [
      ['↶ Undo', '', Instant.undo, app.running || !app.history.length],
      ['↺ Restart', '', Instant.restart, app.running || !app.played.length],
    ];
  },
};
// Time Attack: endless runner. Cards come from a weighted random pool; you
// have a few seconds per pick (less the further you get). Too slow or a
// fatal move costs a heart; dying puts you back where you were before the card.
const TimeAttack = {
  start() {
    const T = CONFIG.timeAttack;
    app.level = { name: 'Time Attack', map: [], cards: [] }; app.levelKey = 'time';
    app.map = makeEndlessMap();
    app.map.start.y = app.map.grid.findIndex((r) => r[1] === '#') - 1;
    app.state = initialState(app.map);
    app.view = { ...clone(app.state), ox: 0, oy: 0 }; app.cam = 0; app.particles = [];
    app.ta = { hearts: T.hearts, dist: 0, gems: 0, deadline: null, limitMs: 0, paused: null, over: false };
    app.hand = []; app.played = []; app.seq = [];
    TimeAttack.fill();
    renderDeck();
    showBanner('Time Attack', `Go as far as you can. You get about ${T.startSeconds}s to pick each card, less the further you go.\nToo slow or a bad move costs a heart. Keys 1–${T.handSize} pick cards.`,
      [['Start', () => { hideBanner(); TimeAttack.arm(); renderDeck(); }]]);
  },
  pick() {
    const pool = Object.entries(CONFIG.timeAttack.pool).filter(([id]) => CARDS[id]);
    let r = Math.random() * pool.reduce((a, [, w]) => a + w, 0);
    for (const [id, w] of pool) if ((r -= w) < 0) return id;
    return pool[0][0];
  },
  fill() {
    while (app.hand.length < CONFIG.timeAttack.handSize) app.hand.push({ uid: uidSeq++, id: TimeAttack.pick() });
    if (!CONFIG.timeAttack.fairDeal || !app.state) return;
    const safe = (id) => runCard(app.map, app.state, id).state.status !== 'dead';
    if (app.hand.some((c) => safe(c.id))) return;
    const options = Object.keys(CONFIG.timeAttack.pool).filter((id) => CARDS[id] && safe(id));
    if (options.length) app.hand[app.hand.length - 1] = { uid: uidSeq++, id: options[Math.floor(Math.random() * options.length)] };
  },
  arm() {
    const T = CONFIG.timeAttack, ta = app.ta;
    if (!ta || ta.over) return;
    ta.limitMs = 1000 * Math.max(T.minSeconds, T.startSeconds - ta.dist * T.speedupPerTile);
    ta.deadline = performance.now() + ta.limitMs;
  },
  // called every frame from draw(): updates the timer bar, checks for timeouts
  tick() {
    const ta = app.ta, bar = $('timerFill');
    if (!ta) return;
    const left = ta.paused ?? (ta.deadline ? ta.deadline - performance.now() : 0);
    const frac = ta.deadline || ta.paused ? Math.max(0, left / ta.limitMs) : 0;
    bar.style.width = (frac * 100) + '%';
    bar.style.background = frac < .3 ? 'var(--bad)' : 'var(--accent)';
    if (ta.deadline && !ta.paused && !app.running && left <= 0) TimeAttack.timeout();
  },
  timeout() {
    app.ta.deadline = null;
    app.flash = { text: 'Too slow! −♥', t0: performance.now() };
    app.hand = []; TimeAttack.fill();
    if (TimeAttack.loseHeart()) TimeAttack.arm();
    renderDeck();
  },
  loseHeart() {
    const ta = app.ta;
    if (--ta.hearts > 0) return true;
    ta.over = true; ta.deadline = null;
    const T = CONFIG.timeAttack, score = ta.dist * T.pointsPerTile + ta.gems * T.pointsPerGem;
    const best = recordBest('time attack', score);
    showBanner('Out of hearts', `Distance ${ta.dist} tiles · ${ta.gems} gem${ta.gems === 1 ? '' : 's'}\nScore ${score}` + (best.isNew ? (best.prev ? ` — new best! (was ${best.prev})` : '') : ` (best ${best.prev})`),
      [['Play again', TimeAttack.start]]);
    return false;
  },
  async clickHand(uid) {
    const ta = app.ta;
    if (app.running || !ta || !ta.deadline || ta.paused) return;
    ta.deadline = null;
    const card = app.hand.splice(app.hand.findIndex((c) => c.uid === uid), 1)[0];
    app.played.push(card);
    const before = clone(app.state);
    app.running = true; renderDeck();
    const status = await playCard(card.id);
    // bank collected gems and drop them from the map (keeps the bitmask small)
    const got = app.state.got;
    if (got) {
      ta.gems += app.map.items.filter((it, i) => got & (1 << i)).length;
      app.map.items = app.map.items.filter((it, i) => !(got & (1 << i)));
      app.state.got = app.view.got = 0;
    }
    let alive = true;
    if (status === 'dead') {
      app.flash = { text: (app.state.why === 'pit' ? 'Fell!' : 'Spiked!') + ' −♥', t0: performance.now() };
      alive = TimeAttack.loseHeart();
      if (alive) { app.state = { ...before, got: 0 }; app.view = { ...clone(app.state), ox: 0, oy: 0 }; }
    }
    ta.dist = Math.max(ta.dist, app.state.x - app.map.start.x);
    extendTerrain(app.map, app.state.x + W + 6);
    app.running = false;
    TimeAttack.fill();
    if (alive) TimeAttack.arm();
    renderDeck();
  },
  clickSeq() {},
  // swap the whole hand; the clock keeps running
  redraw() {
    if (app.running || !app.ta?.deadline || app.ta.paused) return;
    app.hand = []; TimeAttack.fill(); renderDeck();
  },
  pause() {
    const ta = app.ta;
    if (!ta || ta.over || app.running) return;
    if (ta.paused != null) { ta.deadline = performance.now() + ta.paused; ta.paused = null; hideBanner(); }
    else if (ta.deadline) { ta.paused = ta.deadline - performance.now(); showBanner('Paused', 'Take a breather.', [['Resume', TimeAttack.pause]]); }
    renderDeck();
  },
  actions() {
    const ta = app.ta, live = ta && ta.deadline && !ta.paused && !app.running;
    return [
      ['↻ Redraw (clock runs)', '', TimeAttack.redraw, !live],
      [ta?.paused != null ? '▶ Resume' : '⏸ Pause', '', TimeAttack.pause, !ta || ta.over || (!ta.deadline && ta.paused == null)],
      ['↺ Restart', '', TimeAttack.start, app.running],
    ];
  },
};

// Shop-run roguelite: pick a route (previewed levels), buy a hand of cards
// with gems, then solve the level Plan & Run style. Perks change the rules.
const Quest = {
  start() {
    const Q = CONFIG.quest;
    app.q = { depth: 0, cleared: 0, hearts: Q.hearts, maxHearts: Q.hearts, gems: Q.startGems, perks: [], route: null, earned: 0 };
    app.hand = []; app.seq = []; app.played = [];
    app.level = { name: 'Roguelite', map: Array(H).fill('.'.repeat(W)), cards: [] }; app.levelKey = 'quest';
    resetRun();
    Quest.showRoutes();
  },
  has: (p) => !!app.q?.perks.includes(p),
  mods() { const m = {}; for (const p of app.q.perks) if (CONFIG.quest.perks[p].mod) m[CONFIG.quest.perks[p].mod] = true; return m; },
  handLimit: () => CONFIG.quest.handLimit + (Quest.has('pockets') ? 2 : 0),
  owned: () => app.seq.length,
  basePrices() { const p = {}; for (const [id, c] of Object.entries(CONFIG.quest.prices)) if (CARDS[id]) p[id] = c; return p; },
  price(id) {
    let c = CONFIG.quest.prices[id];
    if (Quest.has('thrifty') && id.startsWith('walk')) c--;
    if (Quest.has('echoes') && id === 'echo') c = 0;
    return Math.max(0, c);
  },
  makeRoute(kind) {
    const Q = CONFIG.quest, q = app.q, risky = kind === 'risky';
    const pool = Object.keys(Quest.basePrices()), deck = pool.flatMap((id) => [id, id, id]);
    for (let tries = 0; tries < 8; tries++) {
      const depth = Math.max(1, q.depth + 1 + (risky ? 2 : 0) - Math.floor(tries / 3));
      const g = generateLevel(depth, deck, Math.random, { skipOdds: true, keepGems: true, extraGems: risky ? 2 : 0 });
      if (!g) continue;
      // must be solvable with YOUR perks (Long Legs can make exact steps impossible)…
      const modded = parseLevel(g.level); modded.mods = Quest.mods();
      const withPerks = cheapestSolution(modded, Quest.basePrices(), Quest.handLimit());
      if (!withPerks) continue;
      // budget = that solution at normal prices: movement perks change HOW you solve,
      // price perks (Thrifty, Echo Discount) are where the savings come from
      const cheap = withPerks;
      const ramp = Math.min(1, q.depth / Q.budgetRamp);
      const mult = Q.budgetStart + (Q.budgetEnd - Q.budgetStart) * ramp - (risky ? Q.riskyTighter : 0);
      const budget = Math.max(cheap.cost, Math.ceil(cheap.cost * mult));
      // drop gems you can't reach with your perks; make sure the shop sells what the reachable ones need
      const pruned = pruneGems(g.level, Quest.basePrices(), Quest.handLimit(), Quest.mods());
      const stock = [...new Set([...cheap.seq, ...pruned.routes.flat()])];
      for (const id of shuffle([...pool])) if (stock.length < Q.shopSize && !stock.includes(id)) stock.push(id);
      return { kind, level: pruned.level, cheapest: cheap.cost, budget, stock: pool.filter((id) => stock.includes(id)) };
    }
    return null;
  },
  showRoutes() {
    const q = app.q, Q = CONFIG.quest;
    const routes = [Quest.makeRoute('safe'), Quest.makeRoute('risky'), q.hearts < q.maxHearts ? { kind: 'rest' } : { kind: 'shrine' }].filter(Boolean);
    const box = document.createElement('div'); box.className = 'routes';
    const info = {
      safe: (r) => [`Budget +${r.budget}◆`, 'A comfortable margin'],
      risky: (r) => [`Budget +${r.budget}◆ (tighter)`, `More gems on the map`, '+ a perk if you clear it'],
      rest: () => ['Heal 1 ♥', 'No level'],
      shrine: () => [`Pay ${Q.shrineCost}◆ for a perk`, q.gems < Q.shrineCost ? `You have ${q.gems}◆` : 'No level'],
    };
    const titles = { safe: 'Safe', risky: 'Risky', rest: 'Rest', shrine: 'Shrine' };
    for (const r of routes) {
      const tile = document.createElement('button'); tile.className = 'route ' + r.kind;
      tile.appendChild(Object.assign(document.createElement('b'), { textContent: titles[r.kind] }));
      if (r.level) { const m = document.createElement('canvas'); drawMini(r.level, m, 7); tile.appendChild(m); }
      else tile.appendChild(Object.assign(document.createElement('div'), { className: 'icon', textContent: r.kind === 'rest' ? '♥' : '✦' }));
      for (const line of info[r.kind](r)) tile.appendChild(Object.assign(document.createElement('small'), { textContent: line }));
      tile.disabled = r.kind === 'shrine' && q.gems < Q.shrineCost;
      tile.onclick = () => Quest.enter(r);
      box.appendChild(tile);
    }
    showBanner(q.depth ? 'Choose your next route' : 'Choose your route',
      `Level ${q.depth + 1}  ·  ${'♥'.repeat(q.hearts)}${'♡'.repeat(q.maxHearts - q.hearts)}  ·  ◆ ${q.gems}`, [['Give up run', Quest.over, true]], box);
  },
  enter(r) {
    const q = app.q;
    if (r.kind === 'rest') { q.hearts = Math.min(q.maxHearts, q.hearts + 1); return Quest.showRoutes(); }
    if (r.kind === 'shrine') { q.gems -= CONFIG.quest.shrineCost; return Quest.perkChoice(Quest.showRoutes); }
    q.route = r; q.depth++; q.gems += r.budget;
    app.level = { ...r.level, name: `Level ${q.depth}`, cards: [] };
    app.hand = []; app.seq = []; app.played = [];
    resetRun();
    app.flash = { text: `Budget +${r.budget}◆`, t0: performance.now() };
  },
  buy(id, at = app.seq.length) {
    const q = app.q, price = Quest.price(id);
    if (app.running || q.gems < price || Quest.owned() >= Quest.handLimit()) return;
    q.gems -= price;
    app.seq.splice(at, 0, { uid: uidSeq++, id, paid: price });   // straight into your plan (end, or where you dropped it)
    if (app.cursor || app.state.status !== 'playing') resetRun(); else renderDeck();
  },
  // clicking a planned card sells it back for what you paid
  sell(uid) {
    if (app.running) return;
    const i = app.seq.findIndex((c) => c.uid === uid);
    app.q.gems += app.seq[i].paid;
    app.seq.splice(i, 1);
    if (app.cursor || app.state.status !== 'playing') resetRun(); else renderDeck();
  },
  moveTo: (uid, at) => Plan.moveTo(uid, at),
  sellAll() {
    if (app.running) return;
    app.q.gems += app.seq.reduce((a, c) => a + c.paid, 0); app.seq = []; resetRun();
  },
  clickHand() {},
  clickSeq: (uid) => Quest.sell(uid),
  finish(status, outOfCards) {
    const q = app.q, Q = CONFIG.quest;
    if (status === 'won') {
      const gems = gemCount(app.map, app.state), pickup = gems * Q.gemValue * (Quest.has('magnet') ? 2 : 1);
      const unused = Quest.owned() - app.cursor;
      q.gems += pickup;
      const piggy = Quest.has('piggy') && q.gems >= 5 ? 2 : 0;
      q.gems += piggy; q.cleared++;
      const lines = [`Cleared with ${app.cursor} card${app.cursor === 1 ? '' : 's'}.`];
      if (pickup) lines.push(`Gems picked up: +${pickup}◆`);
      if (piggy) lines.push('Piggy Bank: +2◆');
      if (unused) lines.push(`${unused} unused card${unused > 1 ? 's' : ''} left behind.`);
      if (q.gems > Q.carryCap) { lines.push(`You can only carry ${Q.carryCap}◆ (${q.gems - Q.carryCap}◆ left behind).`); q.gems = Q.carryCap; }
      lines.push(`You carry ${q.gems}◆ to the next route.`);
      const nextStep = q.route.kind === 'risky' ? ['Choose a perk →', () => Quest.perkChoice(Quest.showRoutes)] : ['Choose next route →', Quest.showRoutes];
      showBanner(`Level ${q.depth} cleared!`, lines.join('\n'), [nextStep]);
    } else if (status === 'dead' || outOfCards) {
      q.hearts--;
      if (q.hearts <= 0) return Quest.over();
      const why = status === 'dead' ? (app.state.why === 'pit' ? 'Fell in a pit!' : 'Spiked!')
        : app.map.keyMask && !hasAllKeys(app.map, app.state) ? 'The door stayed locked' : "Didn't reach the flag";
      showBanner(why, `−1 ♥ (${q.hearts} left). Your cards are still in your plan: drag to reorder, tap to sell, or buy more, then press Play again.`, [['Try again', resetRun]]);
    }
  },
  perkChoice(then) {
    const q = app.q, all = CONFIG.quest.perks;
    const offers = shuffle(Object.keys(all).filter((p) => !q.perks.includes(p))).slice(0, 3);
    if (!offers.length) return then();
    const box = document.createElement('div'); box.className = 'routes';
    for (const p of offers) {
      const tile = document.createElement('button'); tile.className = 'route perk';
      tile.append(Object.assign(document.createElement('b'), { textContent: all[p].name }), Object.assign(document.createElement('small'), { textContent: all[p].desc }));
      tile.onclick = () => {
        q.perks.push(p);
        if (p === 'heart') { q.maxHearts++; q.hearts = q.maxHearts; }
        then();
      };
      box.appendChild(tile);
    }
    showBanner('Choose a perk', 'Perks last for the rest of the run.', [['Skip', then]], box);
  },
  over() {
    const q = app.q, score = q.cleared * 100 + q.gems;
    const best = recordBest('shop run', score);
    showBanner('Run over', `You cleared ${q.cleared} level${q.cleared === 1 ? '' : 's'} with ${q.perks.length} perk${q.perks.length === 1 ? '' : 's'}.\nScore ${score}`
      + (best.isNew ? (best.prev ? ` — new best! (was ${best.prev})` : '') : ` (best ${best.prev})`), [['New run', Quest.start]]);
  },
  actions() {
    return [...Plan.actions().filter(([label]) => !label.startsWith('💡') && label !== 'Clear'),
      ['Sell all', '', Quest.sellAll, app.running || !app.seq.length],
      ['Give up run', '', () => { if (!app.running && confirm('Give up this run?')) Quest.over(); }, app.running]];
  },
};

// Experiment 2: roguelite run. Deck → shuffled draw pile → hand of N.
// Playing a card plays it immediately and draws a replacement. Each level
// has a step budget (shortest solution + spare). Die or run out of steps →
// lose a heart. Clear a level → pick a new card for the deck.
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const Run = {
  start() {
    app.run = { depth: 0, cleared: 0, hearts: CONFIG.run.hearts, score: 0, cycling: false, nextGen: null,
      deck: CONFIG.run.startingDeck.filter((id) => CARDS[id]).map((id) => ({ uid: uidSeq++, id })) };
    Run.next();
  },
  next() {
    const r = app.run;
    r.depth++;
    const types = [...new Set(r.deck.map((c) => c.id))];
    // use the previewed level if there was one (its par may change with the new deck)
    const path = r.nextGen && shortestPath(r.nextGen.level, types, 14);
    r.gen = path ? { ...r.nextGen, par: path.length, path } : generateLevel(r.depth, r.deck.map((c) => c.id));
    r.nextGen = null;
    if (!r.gen) { showBanner('Could not build a level', 'The generator gave up — try a new run.', [['New run', Run.start]]); return; }
    app.level = r.gen.level; app.levelKey = 'run';
    Run.retry();
  },
  retry() {
    const r = app.run;
    r.draw = shuffle([...r.deck]); r.discard = [];
    r.steps = r.gen.par + CONFIG.run.spareSteps;
    r.swaps = CONFIG.run.freeSwaps; r.cycling = false;
    app.hand = []; app.played = []; app.seq = []; app.history = [];
    Run.fill(); resetRun();
  },
  fill() {
    const r = app.run;
    while (app.hand.length < CONFIG.run.handSize) {
      if (!r.draw.length) { if (!r.discard.length) break; r.draw = shuffle(r.discard); r.discard = []; }
      app.hand.push(r.draw.pop());
    }
  },
  async clickHand(uid) {
    const r = app.run;
    if (app.running || app.state.status !== 'playing' || r.steps <= 0) return;
    if (r.cycling) return Run.cycle(uid);
    const card = app.hand.splice(app.hand.findIndex((c) => c.uid === uid), 1)[0];
    app.played.push(card); r.discard.push(card); r.steps--;
    app.running = true; renderDeck();
    const status = await playCard(card.id);
    app.running = false;
    Run.fill(); Run.after(status);
  },
  clickSeq() {},
  // Swap one card from your hand for the next one in the draw pile. Free, a few times per level.
  cycle(uid) {
    const r = app.run;
    r.cycling = false; r.swaps--;
    r.discard.push(app.hand.splice(app.hand.findIndex((c) => c.uid === uid), 1)[0]);
    Run.fill(); renderDeck();
  },
  toggleCycle() {
    const r = app.run;
    if (app.running || app.state.status !== 'playing' || r.swaps <= 0) return;
    r.cycling = !r.cycling; renderDeck();
  },
  // Throw the hand away and draw a new one. Costs a step and a turn.
  async mulligan() {
    const r = app.run;
    if (app.running || app.state.status !== 'playing' || r.steps <= 0) return;
    r.discard.push(...app.hand); app.hand = []; r.steps--;
    app.running = true; renderDeck();
    const last = app.state.last;
    const status = await playCard('wait');
    app.state.last = last;      // a mulligan isn't something Echo can repeat
    app.running = false;
    Run.fill(); Run.after(status);
  },
  after(status) {
    const r = app.run;
    if (status === 'won') Run.reward();
    else if (status === 'dead') Run.loseHeart(app.state.why === 'pit' ? 'Fell in a pit!' : 'Spiked!');
    else if (r.steps <= 0) Run.loseHeart('Out of steps');
    else if (status === 'playing' && !canFinish(app.map, app.state, [...new Set(r.deck.map((c) => c.id))], r.steps)) {
      // soft-lock: no combination of your cards reaches the flag any more, so say so now
      const noKey = app.map.keyMask && !hasAllKeys(app.map, app.state);
      Run.loseHeart('Stuck!', noKey ? "You can't get back to the key from here." : "You can't reach the flag from here any more.");
    }
    renderDeck();
  },
  loseHeart(title, why = '') {
    const r = app.run;
    r.hearts--;
    r.cycling = false;
    if (r.hearts <= 0) {
      let text = `You made it to level ${r.depth} with a ${r.deck.length}-card deck.`;
      if (CONFIG.features.gems) {
        const best = recordBest('roguelite run', r.score);
        text += `\nScore: ${r.score}` + (best.isNew ? (best.prev ? ` — new best! (was ${best.prev})` : '') : ` (best ${best.prev})`);
      }
      showBanner('Run over', text, [['New run', Run.start]]);
    }
    else showBanner(title, (why ? why + '\n' : '') + `${r.hearts} heart${r.hearts === 1 ? '' : 's'} left. The level stays the same; your deck is reshuffled.`, [['Retry level', Run.retry]]);
  },
  reward() {
    const r = app.run, C = CONFIG.run;
    r.cleared++;
    let text = '';
    if (CONFIG.features.gems) {
      const sc = scoreFor(app.map, app.state, r.steps);
      r.score += sc.points;
      text += `${sc.text}\nRun total: ${r.score}\n`;
    }
    if (C.healEvery && r.cleared % C.healEvery === 0 && r.hearts < C.hearts) { r.hearts++; text += '+1 ♥ for clearing ' + C.healEvery + ' levels!\n'; }
    if (C.preview) r.nextGen = generateLevel(r.depth + 1, r.deck.map((c) => c.id));
    r.rewardText = text;
    r.addPicks = shuffle(C.rewardPool.filter((id) => CARDS[id])).slice(0, 3);
    if (C.rewardStyle === 'trade') { r.offers = Run.pickOffers(); Run.tradeView(); }
    else Run.rewardView('add');
  },
  // Steps the next level needs with these cards (null = impossible)
  parWith(ids) {
    const n = app.run.nextGen;
    const p = n && shortestPath(n.level, [...new Set(ids)], 14);
    return p ? p.length : null;
  },
  // What a card would do for the next level, in plain words
  offerNote(id) {
    const ids = app.run.deck.map((c) => c.id);
    if (!app.run.nextGen) return ids.includes(id) ? 'More copies = drawn more often' : 'New move for your deck';
    const base = Run.parWith(ids), withIt = Run.parWith([...ids, id]);
    if (base == null && withIt != null) return 'Makes the next level possible!';
    if (withIt != null && withIt < base) return `Next level: ${base - withIt} step${base - withIt > 1 ? 's' : ''} shorter`;
    return ids.includes(id) ? 'More copies = drawn more often' : 'Not needed for the next level';
  },
  // Three offers; at least one helps the next level if any card can
  pickOffers() {
    const pool = shuffle(CONFIG.run.rewardPool.filter((id) => CARDS[id]));
    const ids = app.run.deck.map((c) => c.id), base = Run.parWith(ids);
